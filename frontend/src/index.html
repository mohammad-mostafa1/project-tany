<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VoltEdge — Electronics Store</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="VoltEdge — mobiles, laptops and accessories at real Egyptian prices."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode visitor never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('voltedge-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
